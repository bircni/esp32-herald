name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The simulator opens an SDL2 window.
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Release: the redraw test checks every frame pixel by pixel.
      - name: cargo test
        run: cargo test --workspace --release

  firmware-fmt:
    name: Firmware format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      # The firmware needs the Xtensa toolchain to build; formatting does not.
      # The firmwares' rust-toolchain.toml selects the ESP toolchain, which
      # this runner does not have; rustfmt is the same on stable.
      - name: cargo fmt
        working-directory: crates
        env:
          RUSTUP_TOOLCHAIN: stable
        run: rustfmt --edition 2024 --check firmware/src/*.rs firmware-epaper/src/*.rs
