[workspace]
resolver = "2"
members = ["crates/ui", "crates/simulator"]
# The firmware targets xtensa-esp32-espidf with its own toolchain and cargo
# config, so it is built from inside crates/firmware.
exclude = ["crates/firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["bircni"]
license = "MIT"
repository = "https://github.com/bircni/esp32-herald"

[workspace.lints.rust]
unsafe_code = "deny"
deprecated = "warn"
elided_lifetimes_in_paths = "warn"
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

[workspace.lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Restriction lints, as in the other repos.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
create_dir = "warn"
clone_on_ref_ptr = "warn"
expect_used = "warn"
missing_assert_message = "warn"
panic_in_result_fn = "warn"
str_to_string = "warn"
todo = "warn"
unwrap_used = "warn"
unimplemented = "warn"
wildcard_enum_match_arm = "warn"
# Drawing code converts between i32/u32/u16 pixel values all the time, all
# bounded by the 480x320 screen; casts there are intentional.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# mul_add is no faster on the ESP32 and reads worse in layout maths.
suboptimal_flops = "allow"
# `assert!(x.is_empty())` reads better than `assert_eq!(x, [] as [T; 0])`.
assert_is_empty = "allow"
