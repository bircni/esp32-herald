# The build target differs per board, so it is passed by the Makefile
# (`make build-<board>`), together with ESP_IDF_SYS_ROOT_CRATE.

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
# v5.5.6 fails to create the WiFi task on the ESP32 (ESP_ERR_NO_MEM at boot,
# with 200 KB free); stay on v5.5.5 until that is understood.
ESP_IDF_VERSION = "v5.5.5"
# Keep the ESP-IDF checkout and its tools inside this folder (.embuild/),
# shared by all boards.
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
